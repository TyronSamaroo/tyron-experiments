[project]
name = "pomodoro-cli"
version = "0.1.0"
description = "A CLI Pomodoro timer with session tracking and stats"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "colorama>=0.4.6",
]

[project.scripts]
pomodoro = "pomodoro.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pomodoro"]
